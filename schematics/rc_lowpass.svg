<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260">
<title>RC low-pass filter</title>
<rect width="480" height="260" rx="14" fill="#0f1724"/>
<text x="54" y="114" fill="#c792ea" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="end" font-weight="bold">IN</text>
<polyline points="60,110 120,110" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<polyline points="120,110 158.0,110.0" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<polyline points="202.0,110.0 240,110" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(180.0,110.0) rotate(0)" stroke="#e6eef8" stroke-width="2" fill="none"><rect x="-22" y="-8" width="44" height="16" fill="#16233a"/></g>
<text x="180.0" y="88.0" fill="#7fd1c7" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="middle" font-weight="bold">R1</text>
<text x="180.0" y="136.0" fill="#f2c46d" font-size="11" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="middle" font-weight="normal">10 kΩ</text>
<polyline points="240,110 330,110" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<circle cx="290" cy="110" r="3.5" fill="#8fb3d9"/>
<polyline points="290,110 290.0,150.0" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<polyline points="290.0,160.0 290,200" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(290.0,155.0) rotate(90)" stroke="#e6eef8" stroke-width="2" fill="none"><line x1="-5" y1="-14" x2="-5" y2="14"/><line x1="5" y1="-14" x2="5" y2="14"/></g>
<text x="308.0" y="152.0" fill="#7fd1c7" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="start" font-weight="bold">C1</text>
<text x="308.0" y="167.0" fill="#f2c46d" font-size="11" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="start" font-weight="normal">100 nF</text>
<polyline points="290,200 290,208" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<g stroke="#e6eef8" stroke-width="2"><line x1="278" y1="208" x2="302" y2="208"/><line x1="283" y1="213" x2="297" y2="213"/><line x1="287" y1="218" x2="293" y2="218"/></g>
<text x="336" y="114" fill="#c792ea" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="start" font-weight="bold">OUT</text>
<text x="240" y="240" fill="#e6eef8" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="middle" font-weight="normal">fc = 1/(2π·R·C) ≈ 159 Hz</text>
</svg>
