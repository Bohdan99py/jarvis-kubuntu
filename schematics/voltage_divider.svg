<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300">
<title>Voltage divider</title>
<rect width="460" height="300" rx="14" fill="#0f1724"/>
<line x1="150" y1="50" x2="170" y2="50" stroke="#e6eef8" stroke-width="2"/>
<text x="160" y="43" fill="#c792ea" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="middle" font-weight="bold">+12V</text>
<polyline points="160,50 160,70" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<polyline points="160,70 160.0,88.0" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<polyline points="160.0,132.0 160,150" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(160.0,110.0) rotate(90)" stroke="#e6eef8" stroke-width="2" fill="none"><rect x="-22" y="-8" width="44" height="16" fill="#16233a"/></g>
<text x="178.0" y="107.0" fill="#7fd1c7" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="start" font-weight="bold">R1</text>
<text x="178.0" y="122.0" fill="#f2c46d" font-size="11" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="start" font-weight="normal">10 kΩ</text>
<polyline points="160,150 160.0,168.0" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<polyline points="160.0,212.0 160,230" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<g transform="translate(160.0,190.0) rotate(90)" stroke="#e6eef8" stroke-width="2" fill="none"><rect x="-22" y="-8" width="44" height="16" fill="#16233a"/></g>
<text x="178.0" y="187.0" fill="#7fd1c7" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="start" font-weight="bold">R2</text>
<text x="178.0" y="202.0" fill="#f2c46d" font-size="11" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="start" font-weight="normal">4.7 kΩ</text>
<polyline points="160,230 160,238" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<g stroke="#e6eef8" stroke-width="2"><line x1="148" y1="238" x2="172" y2="238"/><line x1="153" y1="243" x2="167" y2="243"/><line x1="157" y1="248" x2="163" y2="248"/></g>
<circle cx="160" cy="150" r="3.5" fill="#8fb3d9"/>
<polyline points="160,150 300,150" fill="none" stroke="#8fb3d9" stroke-width="2" stroke-linejoin="round"/>
<text x="306" y="154" fill="#c792ea" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="start" font-weight="bold">VOUT ≈ 3.84 V</text>
<text x="330" y="220" fill="#e6eef8" font-size="12" font-family="DejaVu Sans, Noto Sans, sans-serif" text-anchor="middle" font-weight="normal">Vout = Vin·R2/(R1+R2)</text>
</svg>
