name: Build and release Jarvis

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in CMakeLists.txt
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jarvis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    # A healthy run takes about 5 minutes; a stalled mirror must not hold the
    # release queue for the default 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Downloaded .debs: a run fetches only what changed, so a slow mirror matters
      # less (apt still checks every .deb against the signed index). The key changes
      # with the package list and every month, starting from the latest cache.
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jarvis-apt
          key: apt-${{ matrix.os }}-${{ hashFiles('.github/scripts/install-ci-deps.sh') }}-${{ steps.month.outputs.month }}
          restore-keys: apt-${{ matrix.os }}-
      - name: Install build and test dependencies
        timeout-minutes: 25
        run: .github/scripts/install-ci-deps.sh ~/.cache/jarvis-apt
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DJARVIS_DISTRO=${{ matrix.os }}
          cmake --build build --parallel 4 -- -k 0  # report every failing file, not just the first
      - name: Test core, memory, translations, updater and D-Bus
        run: |
          ctest --test-dir build --output-on-failure
          JARVIS_NODE="$(command -v node)" JARVIS_TEST_BUILD="$PWD/build" dbus-run-session --config-file=tests/test-bus.conf -- python3 tests/integration.py
          desktop-file-validate org.jarvis.Jarvis.desktop
      - name: QML smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          ANTHROPIC_API_KEY: ''
        run: |
          set +e
          timeout 5s dbus-run-session --config-file=tests/test-bus.conf -- ./build/jarvis --quick > ui.log 2>&1
          result=$?
          set -e
          cat ui.log
          test "$result" -eq 124
          ! grep -E 'failed to load|ReferenceError|TypeError|Binding loop|Cannot assign' ui.log
      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -B dist
          sha256sum dist/*.deb > dist/SHA256SUMS-${{ matrix.os }}
          dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/SHA256SUMS-*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jarvis-*
          merge-multiple: true
          path: dist
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version=$(sed -n 's/^project(jarvis VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="v$version"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_REF" = "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "Release $tag already exists; increment the project version instead of replacing published packages."
              exit 1
            fi
          else
            gh release create "$tag" --target "$RELEASE_SHA" --title "Jarvis $version" --generate-notes --draft
          fi
          gh release upload "$tag" dist/*.deb dist/SHA256SUMS-* --clobber
          gh release edit "$tag" --draft=false --latest
